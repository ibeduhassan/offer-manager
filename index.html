<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Offer Manager</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div id="menu"></div>


<div class="container">

    <div id="message"></div>


    <div class="box">

        <h1 id="formTitle">
            New Offer
        </h1>


        <form id="offerForm">

            <input
                type="hidden"
                id="editId"
                value=""
            >


            <label>
                Instruction
            </label>

            <textarea
                id="instruction"
                placeholder="Write offer instruction here..."
            ></textarea>


            <div class="mate-title">
                Select Mate *
            </div>


            <div
                class="mate-list"
                id="mateList"
            >
                Loading mates...
            </div>


            <div class="buttons">

                <button
                    type="submit"
                    class="primary"
                    id="saveButton"
                >
                    Save New Offer
                </button>


                <button
                    type="button"
                    class="gray"
                    id="cancelButton"
                    style="display:none"
                >
                    Cancel
                </button>

            </div>

        </form>

    </div>


    <div class="box">

        <h2>Saved Offers</h2>


        <div
            class="table-wrapper"
            id="offersTable"
        >
            Loading...
        </div>

    </div>

</div>


<script src="config.js"></script>

<script src="app.js"></script>


<script>

let allOffers = [];


// ============================================================
// LOAD
// ============================================================

async function loadOffersPage() {

    try {

        const result =
            await apiGet('all');


        if (!result.success) {

            throw new Error(
                result.error ||
                'Could not load data.'
            );

        }


        allOffers =
            result.offers || [];


        renderMates(
            result.mates || []
        );


        renderOffers();


    } catch (error) {

        showError(error);

    }

}


// ============================================================
// MATES
// ============================================================

function renderMates(mates) {

    const container =
        document.getElementById('mateList');


    if (mates.length === 0) {

        container.innerHTML =
            'No mates found. Add mates first.';

        return;

    }


    container.innerHTML = '';


    mates.forEach(function(mate) {

        const label =
            document.createElement('label');

        label.className =
            'mate-item';


        label.innerHTML = `

            <input
                type="checkbox"
                name="mates"
                value="${escapeHtml(mate)}"
            >

            ${escapeHtml(mate)}

        `;


        container.appendChild(label);

    });

}


// ============================================================
// RENDER OFFERS
// ============================================================

function renderOffers() {

    const container =
        document.getElementById(
            'offersTable'
        );


    if (allOffers.length === 0) {

        container.innerHTML =
            '<div class="message">No offers available.</div>';

        return;

    }


    let html = `

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Instruction</th>

                    <th>Mate</th>

                    <th>Edit</th>

                    <th>Delete</th>

                </tr>

            </thead>

            <tbody>

    `;


    allOffers.forEach(function(offer) {

        const mates =
            (offer.list_mate || [])
            .map(function(mate) {

                return `
                    <span>
                        ${escapeHtml(mate)}
                    </span>
                `;

            })
            .join(', ');


        html += `

            <tr>

                <td>
                    ${offer.id}
                </td>

                <td>
                    ${escapeHtml(
                        offer.instruction
                    ).replace(/\n/g, '<br>')}
                </td>

                <td>
                    ${mates}
                </td>

                <td>

                    <button
                        class="warning"
                        onclick="editOffer(${offer.id})"
                    >
                        Edit
                    </button>

                </td>

                <td>

                    <button
                        class="danger"
                        onclick="deleteOffer(${offer.id})"
                    >
                        Delete
                    </button>

                </td>

            </tr>

        `;

    });


    html += `

            </tbody>

        </table>

    `;


    container.innerHTML = html;

}


// ============================================================
// ADD / UPDATE
// ============================================================

document
    .getElementById('offerForm')
    .addEventListener(
        'submit',
        async function(event) {

            event.preventDefault();


            const checked =
                Array.from(
                    document.querySelectorAll(
                        'input[name="mates"]:checked'
                    )
                )
                .map(function(input) {

                    return input.value;

                });


            if (checked.length === 0) {

                alert(
                    'Please select at least one mate.'
                );

                return;

            }


            const instruction =
                document
                .getElementById(
                    'instruction'
                )
                .value;


            const editId =
                document
                .getElementById(
                    'editId'
                )
                .value;


            try {

                document
                    .getElementById(
                        'saveButton'
                    )
                    .disabled = true;


                if (editId) {

                    await apiPost(
                        'updateOffer',
                        {
                            id: editId,
                            instruction: instruction,
                            mates: JSON.stringify(checked)
                        }
                    );

                } else {

                    await apiPost(
                        'addOffer',
                        {
                            instruction: instruction,
                            mates: JSON.stringify(checked)
                        }
                    );

                }


                resetForm();

                await loadOffersPage();


                showMessage(
                    editId
                        ? 'Offer updated successfully.'
                        : 'New offer added successfully.'
                );


            } catch (error) {

                showError(error);

            } finally {

                document
                    .getElementById(
                        'saveButton'
                    )
                    .disabled = false;

            }

        }
    );


// ============================================================
// EDIT
// ============================================================

function editOffer(id) {

    const offer =
        allOffers.find(function(item) {

            return Number(item.id) ===
                Number(id);

        });


    if (!offer) {
        return;
    }


    document
        .getElementById('editId')
        .value = offer.id;


    document
        .getElementById('instruction')
        .value = offer.instruction;


    document
        .getElementById('formTitle')
        .textContent =
            'Edit Offer #' + offer.id;


    document
        .getElementById('saveButton')
        .textContent =
            'Update Offer';


    document
        .getElementById('cancelButton')
        .style.display =
            'inline-block';


    document
        .querySelectorAll(
            'input[name="mates"]'
        )
        .forEach(function(input) {

            input.checked =
                offer.list_mate
                .map(String)
                .includes(
                    String(input.value)
                );

        });


    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });

}


// ============================================================
// DELETE
// ============================================================

async function deleteOffer(id) {

    if (
        !confirm(
            'Are you sure you want to delete this offer?'
        )
    ) {

        return;

    }


    try {

        await apiPost(
            'deleteOffer',
            {
                id: id
            }
        );


        await loadOffersPage();


        showMessage(
            'Offer deleted successfully.'
        );


    } catch (error) {

        showError(error);

    }

}


// ============================================================
// RESET
// ============================================================

function resetForm() {

    document
        .getElementById('offerForm')
        .reset();


    document
        .getElementById('editId')
        .value = '';


    document
        .getElementById('formTitle')
        .textContent =
            'New Offer';


    document
        .getElementById('saveButton')
        .textContent =
            'Save New Offer';


    document
        .getElementById('cancelButton')
        .style.display =
            'none';

}


document
    .getElementById('cancelButton')
    .addEventListener(
        'click',
        resetForm
    );


// ============================================================
// MESSAGE
// ============================================================

function showMessage(text) {

    const message =
        document.getElementById(
            'message'
        );


    message.innerHTML = `

        <div class="message success">
            ${escapeHtml(text)}
        </div>

    `;


    setTimeout(function() {

        message.innerHTML = '';

    }, 3000);

}


// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

}


// ============================================================
// MENU + LOAD
// ============================================================

createMenu('offers');

loadOffersPage();

</script>

</body>

</html>
